# Render Blueprint — hosts Heistproof's console as a static site (no server, no keys, sandbox data only).
# Deploy: create a Render account, connect this repo, and Render reads this file. The build runs the project's own
# static export (scripts/build-site.mjs) and publishes the `site/` folder.
services:
  - type: web
    name: heistproof-console
    runtime: static
    # The static export needs no npm packages; skipping npm ci also skips the demo setup (Chromium, demo shops).
    buildCommand: node scripts/build-site.mjs site --url https://heistproof-console.onrender.com/
    staticPublishPath: site
    pullRequestPreviewsEnabled: false
    envVars:
      - key: NODE_VERSION
        value: 24.22.2
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
