name: Heistproof
description: Rob your PayPal checkout ten ways before you merge it. Offline by default (a local PayPal stand-in, no secrets needed).
branding:
  icon: shield
  color: orange
inputs:
  shop:
    description: Path to the shop in your repository (a folder with package.json and, if it is not built like the Fogline sample, heistproof.json).
    required: true
  sandbox:
    description: "true to run against the real PayPal sandbox instead of the offline stand-in (needs PAYPAL_CLIENT_ID, PAYPAL_CLIENT_SECRET and a sandbox buyer in the environment, and cloudflared)."
    required: false
    default: "false"
outputs:
  verdict:
    description: safe, unsafe or incomplete
    value: ${{ steps.check.outputs.verdict }}
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: 24
        check-latest: true
    - name: Install Heistproof
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        npm ci --ignore-scripts --no-audit --no-fund
        npx playwright install --with-deps chromium
    - name: Rob the checkout
      id: check
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        set +e
        npx tsx src/cli/check.ts "$GITHUB_WORKSPACE/${{ inputs.shop }}" ${{ inputs.sandbox == 'true' && ' ' || '--offline' }} | tee heistproof.log
        code=${PIPESTATUS[0]}
        case $code in 0) v=safe ;; 1) v=unsafe ;; *) v=incomplete ;; esac
        echo "verdict=$v" >> "$GITHUB_OUTPUT"
        report=$(ls -t .heistproof/runs/*/REPORT.md 2>/dev/null | head -1)
        [ -n "$report" ] && cat "$report" >> "$GITHUB_STEP_SUMMARY"
        echo "runs=$(pwd -P)/.heistproof/runs" >> "$GITHUB_OUTPUT"
        exit $code
    - if: always()
      uses: actions/upload-artifact@v7
      with:
        name: heistproof-run
        path: ${{ steps.check.outputs.runs }}
        if-no-files-found: ignore
