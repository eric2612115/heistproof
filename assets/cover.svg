<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1600" viewBox="0 0 2400 1600" role="img" aria-labelledby="hp-title hp-desc">
  <title id="hp-title">Heistproof. Add PayPal. Then try to rob it.</title>
  <desc id="hp-desc">Heistproof adds PayPal to a shop's checkout, then tries to rob it for real in PayPal's sandbox with ten scripted robberies and an AI thief. The verdict is read from PayPal's own records.</desc>
  <defs>
    <style><![CDATA[
      .sans { font-family: Inter, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif; }
      .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; }
    ]]></style>
    <mask id="seam" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect width="512" height="512" fill="#fff"/>
      <rect x="232" y="0" width="48" height="216" fill="#000"/>
      <rect x="232" y="296" width="48" height="216" fill="#000"/>
    </mask>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#0A0A0B" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Canvas -->
  <rect width="2400" height="1600" fill="#FFFFFF"/>

  <!-- Wordmark -->
  <g transform="translate(140 140) scale(0.140625)">
    <circle cx="256" cy="256" r="192" fill="#D2B06A" mask="url(#seam)"/>
  </g>
  <text class="sans" x="232" y="197" font-size="58" font-weight="600" letter-spacing="-1.2" fill="#0A0A0B">Heistproof</text>

  <!-- Sandbox pill -->
  <rect x="1700" y="146" width="560" height="60" rx="30" fill="none" stroke="#E6E6E8"/>
  <circle cx="1740" cy="176" r="6" fill="#1E9E5F"/>
  <text class="mono" x="1762" y="183" font-size="20" fill="#6F6F78">sandbox · real purchases, no real money</text>

  <!-- Headline -->
  <text class="sans" font-size="176" font-weight="600" letter-spacing="-6" fill="#0A0A0B">
    <tspan x="132" y="520">Add PayPal.</tspan>
    <tspan x="132" y="712">Then try to rob it.</tspan>
  </text>
  <text class="sans" x="140" y="836" font-size="44" fill="#5C5C66" letter-spacing="-0.4">Tested for real in PayPal's sandbox.</text>

  <!-- Run panel -->
  <rect x="140" y="940" width="2120" height="520" rx="24" fill="#FAFAFA" stroke="#E6E6E8"/>
  <line x1="140" y1="1004" x2="2260" y2="1004" stroke="#E6E6E8"/>
  <circle cx="188" cy="972" r="6" fill="#1E9E5F"/>
  <text class="mono" x="208" y="979" font-size="20" fill="#6F6F78">run 2026-11-08 · 14:02 · localhost:3000 · PayPal sandbox</text>
  <text class="mono" x="2220" y="979" font-size="20" fill="#6F6F78" text-anchor="end">6 steps · 11 min · replayable</text>

  <!-- Column captions -->
  <g class="mono" font-size="17" font-weight="600" letter-spacing="1.5" fill="#6F6F78">
    <text x="180" y="1042">10 ROBBERIES</text>
    <text x="1080" y="1042">THE CHECKOUT</text>
    <text x="1660" y="1042">VERDICT · BY PAYPAL'S RECORDS</text>
  </g>

  <!-- The ten robberies, every one blocked -->
  <g class="mono">
    <g font-size="17" fill="#A0A0A8">
      <text x="180" y="1098">01</text><text x="180" y="1132">02</text><text x="180" y="1166">03</text><text x="180" y="1200">04</text><text x="180" y="1234">05</text>
      <text x="180" y="1268">06</text><text x="180" y="1302">07</text><text x="180" y="1336">08</text><text x="180" y="1370">09</text><text x="180" y="1404">10</text>
    </g>
    <g font-size="21" fill="#0A0A0B">
      <text x="224" y="1099">Price tampering</text>
      <text x="224" y="1133">Negative quantity</text>
      <text x="224" y="1167">Payment nobody approved</text>
      <text x="224" y="1201">Approval without payment</text>
      <text x="224" y="1235">Declined card</text>
      <text x="224" y="1269">Double click</text>
      <text x="224" y="1303">Forged webhook</text>
      <text x="224" y="1337">Webhook replay</text>
      <text x="224" y="1371">Late event</text>
      <text x="224" y="1405">Secret in the browser</text>
    </g>
  </g>
  <g fill="#1E9E5F">
    <circle cx="640" cy="1092" r="9"/><circle cx="640" cy="1126" r="9"/><circle cx="640" cy="1160" r="9"/><circle cx="640" cy="1194" r="9"/><circle cx="640" cy="1228" r="9"/>
    <circle cx="640" cy="1262" r="9"/><circle cx="640" cy="1296" r="9"/><circle cx="640" cy="1330" r="9"/><circle cx="640" cy="1364" r="9"/><circle cx="640" cy="1398" r="9"/>
  </g>
  <g fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M635.5 1092 L639 1095.5 L645 1088.5"/><path d="M635.5 1126 L639 1129.5 L645 1122.5"/><path d="M635.5 1160 L639 1163.5 L645 1156.5"/><path d="M635.5 1194 L639 1197.5 L645 1190.5"/><path d="M635.5 1228 L639 1231.5 L645 1224.5"/>
    <path d="M635.5 1262 L639 1265.5 L645 1258.5"/><path d="M635.5 1296 L639 1299.5 L645 1292.5"/><path d="M635.5 1330 L639 1333.5 L645 1326.5"/><path d="M635.5 1364 L639 1367.5 L645 1360.5"/><path d="M635.5 1398 L639 1401.5 L645 1394.5"/>
  </g>
  <g transform="translate(180 1424) scale(0.0390625)">
    <circle cx="256" cy="256" r="192" fill="#D2B06A" mask="url(#seam)"/>
  </g>
  <text class="mono" x="210" y="1440" font-size="19" fill="#8A6D2F">AI thief · invented 6 · none worked</text>

  <!-- Flow: robberies hit the checkout, PayPal's records give the verdict -->
  <path d="M700 1244 H1070" fill="none" stroke="#D4D4D8" stroke-width="1.5"/>
  <polygon points="1070,1238 1080,1244 1070,1250" fill="#D4D4D8"/>
  <path d="M1540 1244 H1600 V1112 H1650" fill="none" stroke="#D4D4D8" stroke-width="1.5"/>
  <polygon points="1650,1106 1660,1112 1650,1118" fill="#D4D4D8"/>

  <!-- The checkout under test -->
  <rect x="1080" y="1064" width="460" height="360" rx="18" fill="#FFFFFF" stroke="#E6E6E8" filter="url(#soft)"/>
  <text class="sans" x="1108" y="1114" font-size="22" font-weight="600" fill="#0A0A0B">Checkout</text>
  <text class="mono" x="1512" y="1112" font-size="14" fill="#6F6F78" text-anchor="end">sandbox</text>
  <text class="sans" x="1108" y="1156" font-size="17" fill="#5C5C66">Bag total</text>
  <text class="mono" x="1512" y="1156" font-size="20" font-weight="600" fill="#0A0A0B" text-anchor="end">$64.00</text>
  <line x1="1108" y1="1178" x2="1512" y2="1178" stroke="#ECECEE"/>
  <rect x="1108" y="1198" width="404" height="52" rx="10" fill="#0070E0"/>
  <text class="sans" x="1310" y="1231" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle">PayPal</text>
  <rect x="1108" y="1262" width="196" height="44" rx="10" fill="none" stroke="#D4D4D8"/>
  <text class="sans" x="1206" y="1290" font-size="16" font-weight="600" fill="#0A0A0B" text-anchor="middle">Pay Later</text>
  <rect x="1316" y="1262" width="196" height="44" rx="10" fill="none" stroke="#D4D4D8"/>
  <text class="sans" x="1414" y="1290" font-size="16" font-weight="600" fill="#0A0A0B" text-anchor="middle">Venmo</text>
  <circle cx="1117" cy="1369" r="8" fill="#1E9E5F"/>
  <path d="M1113 1369 L1116 1372 L1121.5 1366" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="mono" x="1134" y="1374" font-size="15" fill="#157F4B">PayPal charged $64.00 · equals bag total</text>

  <!-- Verdict: a flat stamp -->
  <rect x="1660" y="1064" width="560" height="96" rx="12" fill="#FFFFFF" stroke="#D4D4D8"/>
  <circle cx="1702" cy="1112" r="9" fill="#1E9E5F"/>
  <text class="mono" x="1730" y="1124" font-size="34" font-weight="600" letter-spacing="1" fill="#157F4B">SAFE TO SHIP</text>

  <!-- PayPal's own ids -->
  <g class="mono" font-size="19" fill="#A0A0A8">
    <text x="1660" y="1208">order</text>
    <text x="1660" y="1242">capture</text>
    <text x="1660" y="1276">webhook</text>
  </g>
  <g class="mono" font-size="19" fill="#5C5C66">
    <text x="1772" y="1208">5O190127TN364715T</text>
    <text x="1772" y="1242">3C679366HH908993F · COMPLETED</text>
    <text x="1772" y="1276">signed · verified</text>
  </g>

  <!-- The six steps -->
  <line x1="1682" y1="1360" x2="2198" y2="1360" stroke="#D4D4D8"/>
  <g fill="#1E9E5F">
    <circle cx="1682" cy="1360" r="10"/><circle cx="1785" cy="1360" r="10"/><circle cx="1888" cy="1360" r="10"/><circle cx="1991" cy="1360" r="10"/><circle cx="2094" cy="1360" r="10"/><circle cx="2197" cy="1360" r="10"/>
  </g>
  <g fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M1677 1360 L1680.5 1363.5 L1687 1356.5"/><path d="M1780 1360 L1783.5 1363.5 L1790 1356.5"/><path d="M1883 1360 L1886.5 1363.5 L1893 1356.5"/><path d="M1986 1360 L1989.5 1363.5 L1996 1356.5"/><path d="M2089 1360 L2092.5 1363.5 L2099 1356.5"/><path d="M2192 1360 L2195.5 1363.5 L2202 1356.5"/>
  </g>
  <g class="mono" font-size="15" fill="#6F6F78" text-anchor="middle">
    <text x="1682" y="1402">Add</text><text x="1785" y="1402">Buy</text><text x="1888" y="1402">Rob</text><text x="1991" y="1402">AI thief</text><text x="2094" y="1402">Books</text><text x="2197" y="1402">Ship</text>
  </g>
</svg>
