  <circle cx="256" cy="256" r="104" fill="#111a22" stroke="#2a3a48" stroke-width="6"/>
  <g stroke="url(#brass)" stroke-width="18" stroke-linecap="round">
    <path d="M256 168 L256 344"/>
    <path d="M180 212 L332 300"/>
    <path d="M180 300 L332 212"/>
  </g>
  <circle cx="256" cy="256" r="40" fill="#0b1117" stroke="url(#brass)" stroke-width="10"/>
