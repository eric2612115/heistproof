      <stop offset="0" stop-color="#1a2733"/>
      <stop offset="1" stop-color="#0b1117"/>
    </radialGradient>
    <linearGradient id="brass" gradientUnits="userSpaceOnUse" x1="88" y1="88" x2="424" y2="424">
      <stop offset="0" stop-color="#f1cf7a"/>
      <stop offset="0.55" stop-color="#d4a84b"/>
      <stop offset="1" stop-color="#9c7425"/>
