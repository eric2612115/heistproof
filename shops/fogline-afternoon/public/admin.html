<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fogline back office</title>
    <link rel="stylesheet" href="/styles.css" />
    <style>
      body { background: #0f1820; color: #e9eef2; }
      main { max-width: 1180px; }
      h1 { font-size: 32px; margin: 0 0 6px; }
      .sub { color: #8fa1ad; margin: 0 0 24px; }
      table { width: 100%; border-collapse: collapse; font-size: 14px; }
      th, td { text-align: left; padding: 12px 10px; border-bottom: 1px solid #22313c; vertical-align: top; }
      th { color: #8fa1ad; font-weight: 600; text-transform: uppercase; font-size: 11px; letter-spacing: 1.5px; }
      .pill { display: inline-block; padding: 3px 10px; border-radius: 999px; font-weight: 600; font-size: 12px; }
      .pending { background: #3b3a1f; color: #f5d76e; }
      .paid { background: #1f3b2e; color: #6ee7a8; }
      .fulfilled { background: #1d3550; color: #8cc8ff; }
      .failed { background: #4a1f22; color: #ff9b9b; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; color: #b9c6cf; }
      .warn { color: #ffb36b; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <h1>Back office</h1>
      <p class="sub">Orders, payments and warehouse labels. Refreshes every 2 seconds.</p>
      <table>
        <thead><tr><th>Order</th><th>Items</th><th>Total</th><th>Status</th><th>Paid with</th><th>Payment reference</th><th>Paid</th><th>Labels</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </main>
    <script type="module">
      const params = new URLSearchParams(location.search);
      if (params.get("key")) localStorage.setItem("fogline.admin", params.get("key"));
      const key = localStorage.getItem("fogline.admin") ?? "local-admin";
      const money = (c) => (c == null ? "" : `$${(c / 100).toFixed(2)}`);
      async function load() {
        const res = await fetch("/api/admin/orders", { headers: { "x-admin-key": key } });
        if (!res.ok) { document.querySelector("#rows").innerHTML = `<tr><td colspan="8">Admin key needed: open /admin?key=...</td></tr>`; return; }
        const orders = await res.json();
        document.querySelector("#rows").innerHTML = orders.map((o) => `
          <tr>
            <td class="mono">${o.id}</td>
            <td>${o.items.map((i) => `${i.qty} &times; ${i.name}`).join("<br/>")}</td>
            <td>${money(o.total_cents)}</td>
            <td><span class="pill ${o.status}">${o.status}</span></td>
            <td>${o.payment_method ?? ""}</td>
            <td class="mono">${o.payment_reference ?? ""}</td>
            <td class="${o.paid_cents != null && o.paid_cents !== o.total_cents ? "warn" : ""}">${money(o.paid_cents)}</td>
            <td class="${o.shipments > 1 ? "warn" : ""}">${o.shipments}</td>
          </tr>`).join("") || `<tr><td colspan="8">No orders yet.</td></tr>`;
      }
      load();
      setInterval(load, 2000);
    </script>
  </body>
</html>
