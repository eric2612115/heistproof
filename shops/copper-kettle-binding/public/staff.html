<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Copper Kettle · staff · orders</title>
    <style>
      body { font: 15px/1.45 system-ui, sans-serif; margin: 28px; color: #2b1d14; }
      table { border-collapse: collapse; width: 100%; }
      th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #e7dccd; }
      th { background: #fbf6ef; }
      .shipped { color: #1d6b3a; font-weight: 600; }
      .awaiting_payment { color: #8a6d3b; }
    </style>
  </head>
  <body>
    <h1>Orders</h1>
    <table>
      <thead><tr><th>Order</th><th>State</th><th>Total</th><th>Parcels</th><th>PayPal order</th><th>PayPal capture</th></tr></thead>
      <tbody id="rows"><tr><td colspan="6">Loading…</td></tr></tbody>
    </table>
    <script>
      const token = new URLSearchParams(location.search).get("token") ?? "";
      fetch("/api/staff/orders", { headers: { "x-staff-token": token } })
        .then((r) => (r.ok ? r.json() : Promise.reject(new Error("staff only"))))
        .then(({ orders }) => {
          document.getElementById("rows").innerHTML = orders
            .map((o) => `<tr><td>${o.ref}</td><td class="${o.state}">${o.state}</td><td>$${(o.total_cents / 100).toFixed(2)}</td><td>${o.parcels}</td><td>${o.paypal_order ?? ""}</td><td>${o.paypal_capture ?? ""}</td></tr>`)
            .join("") || '<tr><td colspan="6">No orders yet.</td></tr>';
        })
        .catch((e) => (document.getElementById("rows").innerHTML = `<tr><td colspan="6">${e.message}</td></tr>`));
    </script>
  </body>
</html>
